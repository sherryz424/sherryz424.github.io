<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Projects by Xinran Zhang across interaction, ecological speculation, information systems, moving image and photographic practice." />
    <meta name="theme-color" content="#f2f1ed" />
    <title>Works — Xinran Zhang</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="../favicon.svg" />
    <script src="../theme.js?v=theme1"></script>
    <link rel="stylesheet" href="../styles.css?v=theme1" />
    <link rel="stylesheet" href="./works.css?v=theme1" />
  </head>
  <body class="works-page">
    <div class="page-shell">
      <header class="site-header works-header">
        <a class="identity" href="../" aria-label="Xinran Zhang, home">
          <span>Xinran Zhang</span>
          <span class="identity-role" data-i18n="role">Designer &amp; Creative Technologist</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="../" data-i18n="home">Home</a>
          <a href="./" aria-current="page" data-i18n="works">Works</a>
          <a href="../#about" data-i18n="about">About</a>
          <a href="mailto:18001817638@163.com" data-i18n="contact">Contact</a>
        </nav>
        <div class="header-tools">
          <span class="works-count" data-i18n="worksCount">10 works · 2022—24</span>
          <button class="lang-button" type="button" aria-label="Switch language">EN / 中</button>
          <div class="theme-switch" role="group" aria-label="Theme">
            <button type="button" data-theme-mode="light" aria-pressed="false"><span aria-hidden="true">☀</span><span data-theme-label="light">Light</span></button>
            <button type="button" data-theme-mode="dark" aria-pressed="false"><span aria-hidden="true">◐</span><span data-theme-label="dark">Dark</span></button>
            <button type="button" data-theme-mode="system" aria-pressed="false"><span aria-hidden="true">◉</span><span data-theme-label="system">Auto</span></button>
          </div>
        </div>
      </header>

      <main class="works-shell">
        <aside class="works-index" aria-label="Project index">
          <div class="index-heading">
            <span data-i18n="index">Index</span>
            <span data-i18n="selectWork">Select a work</span>
          </div>
          <div id="project-list"></div>
        </aside>

        <article class="work-detail" id="work-detail" aria-live="polite"></article>
      </main>

      <footer>
        <span>© 2026 Xinran Zhang</span>
        <a href="mailto:18001817638@163.com">18001817638@163.com</a>
      </footer>
    </div>
    <script src="./works.js?v=theme1"></script>
  </body>
</html>
